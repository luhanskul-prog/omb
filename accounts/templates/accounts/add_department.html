<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Department | Luhan School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-header {
            background: linear-gradient(135deg,#0d6efd,#084298);
            color: white;
            padding: 22px 0;
            margin-bottom: 30px;
        }

        .page-title {
            font-weight: 700;
        }

        .card-box {
            background: white;
            border: 1px solid #e1e6ed;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .form-label {
            font-weight: 600;
        }

    </style>

</head>

<body>


<header class="top-header">

    <div class="container">

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    flex-wrap
                    gap-3">

            <div>

                <h2 class="page-title mb-1">
                    Add Department
                </h2>

                <div>
                    Create a new school department.
                </div>

            </div>

            <a
                href="{% url 'accounts:department_management' %}"
                class="btn btn-light"
            >
                ← Departments
            </a>

        </div>

    </div>

</header>



<main class="container pb-5">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags|default:'info' }}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <div class="card-box">

        <form method="post">

            {% csrf_token %}


            <div class="mb-3">

                <label
                    for="name"
                    class="form-label"
                >
                    Department Name
                </label>

                <input
                    type="text"
                    name="name"
                    id="name"
                    class="form-control"
                    value="{{ request.POST.name }}"
                    placeholder="e.g. Mathematics Department"
                    required
                >

            </div>


            <div class="mb-4">

                <label
                    for="description"
                    class="form-label"
                >
                    Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    class="form-control"
                    rows="4"
                    placeholder="Describe the department..."
                >{{ request.POST.description }}</textarea>

            </div>


            <div class="d-flex
                        justify-content-between
                        gap-2">

                <a
                    href="{% url 'accounts:department_management' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    ➕ Create Department
                </button>

            </div>

        </form>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
