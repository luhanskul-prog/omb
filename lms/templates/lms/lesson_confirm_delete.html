<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Lesson | Luhan ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="card mx-auto"
         style="max-width:600px;">

        <div class="card-body p-4">

            <h4>
                Delete Digital Lesson
            </h4>

            <p class="text-muted">

                Are you sure you want to delete:

                <strong>
                    {{ lesson.title }}
                </strong>

                ?

            </p>


            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>


                {% if erp_permission.view_digitallesson %}
                <a
                    href="{% url 'lms:my_lessons' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
                {% endif %}

            </form>

        </div>

    </div>

</div>


</body>

</html>
