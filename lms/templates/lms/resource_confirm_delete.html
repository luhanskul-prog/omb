<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Resource | Luhan ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body style="background:#f5f7fb;">

<div class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3>
                Delete Resource
            </h3>

            <p>
                Are you sure you want to delete:
            </p>

            <strong>
                {{ resource.title }}
            </strong>


            <form method="post"
                  class="mt-4">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">

                    Yes, Delete

                </button>

                <a href="{% url 'lms:resources' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
