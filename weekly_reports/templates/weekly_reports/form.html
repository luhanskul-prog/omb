
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Assessment Reports</title>

<link
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 rel="stylesheet">

<style>
body {
    background:#f4f7fb;
    font-family:Arial,Helvetica,sans-serif;
}

.header {
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    padding:25px 0;
    margin-bottom:25px;
}

.card {
    border:0;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.score {
    font-weight:700;
    font-size:18px;
}

.report-comment {
    background:#f8f9fa;
    border-radius:10px;
    padding:15px;
}

.badge-draft {
    background:#6c757d;
}

.badge-submitted {
    background:#fd7e14;
}

.badge-published {
    background:#198754;
}

.reply {
    border-left:4px solid #0d6efd;
    padding:10px 15px;
    margin-bottom:12px;
    background:#f8f9fa;
}
</style>
</head>

<body>

<div class="header">
<div class="container">
<h2 class="mb-1">Student Weekly Assessment Reports</h2>
<div>Weekly learning progress, scores and teacher reports</div>
</div>
</div>

<main class="container pb-5">

{% if messages %}
{% for message in messages %}
<div class="alert alert-info">{{ message }}</div>
{% endfor %}
{% endif %}

{% block content %}{% endblock %}

</main>

</body>
</html>

{% block content %}

<div class="card p-4">

<h3>{{ title }}</h3>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary">
Save Weekly Report
</button>

<a href="{% url 'weekly_reports:dashboard' %}"
   class="btn btn-secondary">
Cancel
</a>

</form>

</div>

{% endblock %}
