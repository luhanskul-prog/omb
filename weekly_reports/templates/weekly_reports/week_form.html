<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ portal_title }}</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:30px}
        .box{max-width:700px;margin:auto;background:white;padding:30px;border-radius:12px}
        label{display:block;font-weight:bold;margin-top:15px}
        input,select,textarea{width:100%;padding:10px;margin-top:6px;box-sizing:border-box}
        textarea{min-height:100px}
        button,a{display:inline-block;padding:11px 18px;margin-top:20px;border:0;border-radius:7px;text-decoration:none;cursor:pointer}
        button{background:#1646a0;color:white}
        a{background:#e9eef8;color:#173b78}
        .error{
    color:#a00;
    margin-top:12px;
    padding:10px;
    background:#fff0f0;
    border-radius:8px;
}

.success-message{
    position:fixed;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    min-width:320px;
    max-width:90%;
    padding:14px 22px;
    border-radius:50px;
    background:#198754;
    color:#fff;
    text-align:center;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
    animation:successIn .35s ease-out;
}

.success-message .check{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    margin-right:8px;
    border-radius:50%;
    background:#fff;
    color:#198754;
    font-weight:bold;
}

.success-message.hide{
    animation:successOut .5s ease-in forwards;
}

@keyframes successIn{
    from{
        opacity:0;
        transform:translate(-50%,-15px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

@keyframes successOut{
    from{
        opacity:1;
        transform:translate(-50%,0);
    }
    to{
        opacity:0;
        transform:translate(-50%,-15px);
    }
}
    </style>
</head>
<body>
<div class="box">
    <h1>{{ portal_title }}</h1>

    {% if messages %}
        {% for message in messages %}
            {% if "success" in message.tags %}
                <div class="success-message" id="successMessage">
                    <span class="check">✓</span>
                    {{ message }}
                </div>
            {% else %}
                <div class="error">
                    {{ message }}
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Academic Year</label>
        <select name="academic_year" required>
            <option value="">Select academic year</option>
            {% for item in academic_years %}
                <option value="{{ item.id }}" {% if week and week.academic_year_id == item.id %}selected{% endif %}>
                    {{ item }}
                </option>
            {% endfor %}
        </select>

        <label>Term</label>
        <select name="term" required>
            <option value="">Select term</option>
            {% for item in terms %}
                <option value="{{ item.id }}" {% if week and week.term_id == item.id %}selected{% endif %}>
                    {{ item }}
                </option>
            {% endfor %}
        </select>

        <label>Week Number</label>
        <input type="number" name="week_number" min="1" max="53" required value="{{ week.week_number|default:'' }}">

        <label>Week Title</label>
        <input type="text" name="title" placeholder="e.g. Week 1" value="{{ week.title|default:'' }}">

        <label>Date From</label>
        <input type="date" name="week_start" required value="{{ week.week_start|date:'Y-m-d' }}">

        <label>Date To</label>
        <input type="date" name="week_end" required value="{{ week.week_end|date:'Y-m-d' }}">

        <label>Description</label>
        <textarea name="description">{{ week.description|default:'' }}</textarea>

        <button type="submit">Save Week</button>
        <a href="{% url 'weekly_reports:manage_weeks' %}">Cancel</a>
    </form>
</div>

<script>
    setTimeout(function () {
        const message = document.getElementById("successMessage");

        if (message) {
            message.classList.add("hide");

            setTimeout(function () {
                message.remove();
            }, 500);
        }
    }, 4000);
</script>

</body>
</html>
