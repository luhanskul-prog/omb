<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Timetable Entry | Luhan School ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            background: linear-gradient(
                135deg,
                #0d6efd,
                #084298
            );

            color: white;
            padding: 20px 0;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #dee2e6;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.05);
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #495057;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            min-height: 42px;
            font-size: 14px;
        }

        .required {
            color: #dc3545;
        }

    </style>

</head>


<body>


<div class="header">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

            <div>

                <h4 class="mb-1">
                    Add Timetable Entry
                </h4>

                <small>
                    Create a new lesson
                </small>

            </div>


            <a
                href="{% url 'scheduling:timetable' %}"
                class="btn btn-light"
            >
                ← Back to Timetable
            </a>

        </div>

    </div>

</div>



<div class="container py-4">

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert
                {% if message.tags %}
                    alert-{{ message.tags }}
                {% else %}
                    alert-info
                {% endif %}
                alert-dismissible fade show"
            >

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>

            </div>

        {% endfor %}

    {% endif %}



    <div class="form-card">

        <form method="post">

            {% csrf_token %}


            <div class="row g-4">


                <!-- CLASS -->

                <div class="col-md-6">

                    <label>
                        Class <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="class_name"
                        class="form-control"
                        placeholder="e.g. Grade 7"
                        required
                    >

                </div>


                <!-- STREAM -->

                <div class="col-md-6">

                    <label>
                        Stream
                    </label>

                    <input
                        type="text"
                        name="stream"
                        class="form-control"
                        placeholder="e.g. East"
                    >

                </div>


                <!-- SUBJECT -->

                <div class="col-md-6">

                    <label>
                        Subject <span class="required">*</span>
                    </label>

                    <select
                        name="subject"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select subject
                        </option>

                        {% for subject in subjects %}

                            <option value="{{ subject.id }}">
                                {{ subject.name }}
                                {% if subject.code %}
                                    ({{ subject.code }})
                                {% endif %}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- TEACHER -->

                <div class="col-md-6">

                    <label>
                        Teacher
                    </label>

                    <select
                        name="teacher"
                        class="form-select"
                    >

                        <option value="">
                            No teacher assigned
                        </option>

                        {% for teacher in teachers %}

                            <option value="{{ teacher.id }}">
                                {{ teacher.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- DAY -->

                <div class="col-md-6">

                    <label>
                        Day <span class="required">*</span>
                    </label>

                    <select
                        name="day"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select day
                        </option>

                        {% for day in days %}

                            <option value="{{ day.id }}">
                                {{ day.get_name_display }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PERIOD -->

                <div class="col-md-6">

                    <label>
                        Period <span class="required">*</span>
                    </label>

                    <select
                        name="period"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select period
                        </option>

                        {% for period in periods %}

                            <option value="{{ period.id }}">

                                {{ period.name }}

                                —
                                {{ period.start_time|time:"H:i" }}
                                -
                                {{ period.end_time|time:"H:i" }}

                                {% if period.is_break %}
                                    (Break)
                                {% endif %}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- ROOM -->

                <div class="col-md-6">

                    <label>
                        Room / Venue
                    </label>

                    <select
                        name="room"
                        class="form-select"
                    >

                        <option value="">
                            No room assigned
                        </option>

                        {% for room in rooms %}

                            <option value="{{ room.id }}">
                                {{ room.name }}

                                {% if room.room_type %}
                                    — {{ room.room_type }}
                                {% endif %}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- NOTES -->

                <div class="col-md-6">

                    <label>
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        placeholder="Optional notes..."
                    ></textarea>

                </div>


            </div>


            <hr class="my-4">


            <div class="d-flex justify-content-end gap-2">

                <a
                    href="{% url 'scheduling:timetable' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                {% if erp_permission.add_timetableentry %}
                    <button
                        type="submit"
                        class="btn btn-success px-4"
                    >
                        Save Timetable Entry
                    </button>
                {% endif %}

            </div>


        </form>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
