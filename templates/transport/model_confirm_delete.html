{% extends "base.html" %}

{% block content %}

<style>
.transport-delete-page {
    max-width: 650px;
    margin: 60px auto;
    padding: 25px;
}

.transport-delete-card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.transport-delete-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.transport-button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 0;
    text-decoration: none;
    cursor: pointer;
    color: white;
    background: #173f5f;
}

.transport-danger {
    background: #a00000;
}

.transport-cancel {
    background: #777;
}
</style>

<div class="transport-delete-page">

    <div class="transport-delete-card">

        <h1>{{ title }}</h1>

        <p>
            Are you sure you want to delete this
            <strong>{{ singular }}</strong>?
        </p>

        <p>
            <strong>{{ object }}</strong>
        </p>

        <p>
            This action cannot be undone.
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="transport-delete-actions">

                <button
                    type="submit"
                    class="transport-button transport-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url config.list_url %}"
                    class="transport-button transport-cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
