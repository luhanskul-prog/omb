
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Delete {{ model_label }}</title>

<style>

body{
    margin:0;
    background:#f4f7fb;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:80px auto;
    padding:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.delete{
    background:#c62828;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

.cancel{
    background:#eef3fa;
    color:#123878;
    padding:12px 20px;
    border-radius:6px;
    text-decoration:none;
    margin-left:8px;
}


/* =========================================================
   LUHAN TIMETABLE COMPACT NAVIGATION
   ========================================================= */

.timetable-compact-nav{
    display:flex !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    align-items:center !important;
}

.timetable-compact-nav a,
.timetable-compact-nav button{
    font-size:11px !important;
    padding:6px 9px !important;
    line-height:1.15 !important;
    border-radius:6px !important;
}

.timetable-compact-nav i{
    font-size:11px !important;
}

.timetable-compact-title{
    font-size:20px !important;
    line-height:1.2 !important;
}

.timetable-compact-subtitle{
    font-size:11px !important;
    line-height:1.3 !important;
}

.timetable-compact-section{
    font-size:13px !important;
}

.timetable-compact-card-title{
    font-size:13px !important;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Delete {{ model_label }}</h2>

<p>
Are you sure you want to delete:
<strong>{{ object }}</strong>?
</p>

<p>
This action cannot be undone.
</p>

<form method="post">

{% csrf_token %}

<button class="delete" type="submit">
    Yes, Delete
</button>

<a class="cancel"
   href="{% url 'timetable:crud_list' model_key %}">
   Cancel
</a>

</form>

</div>

</div>

</body>
</html>
