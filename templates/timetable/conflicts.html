<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable Conflicts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between mb-4">
        <div>
            <h2 class="fw-bold">Conflict Checker</h2>
            <p class="text-muted">
                Check the timetable for class, teacher and room clashes.
            </p>
        </div>

        <a href="/timetable/workspace/" class="btn btn-outline-primary">
            Workspace
        </a>
    </div>

    {% if conflicts %}

        {% for conflict in conflicts %}
        <div class="alert alert-danger">
            {{ conflict }}
        </div>
        {% endfor %}

    {% else %}

        <div class="alert alert-success">
            No timetable conflicts detected.
        </div>

    {% endif %}

</div>

</body>
</html>
