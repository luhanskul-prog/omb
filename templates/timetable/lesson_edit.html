<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Timetable Lesson</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}
.box{max-width:650px;margin:45px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 3px 18px rgba(0,0,0,.08)}
h1{color:#063b91;margin-top:0}
label{display:block;font-weight:bold;margin-top:16px}
select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #ccd6e5;border-radius:6px;box-sizing:border-box}
button,a{display:inline-block;margin-top:22px;padding:11px 16px;border-radius:7px;text-decoration:none;font-weight:bold;border:0;cursor:pointer}
button{background:#063b91;color:white}
a{background:#eef3f9;color:#063b91}

/* =========================================================
   LUHAN TIMETABLE COMPACT NAVIGATION
   ========================================================= */

.timetable-compact-nav{
    display:flex !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    align-items:center !important;
}

.timetable-compact-nav a,
.timetable-compact-nav button{
    font-size:11px !important;
    padding:6px 9px !important;
    line-height:1.15 !important;
    border-radius:6px !important;
}

.timetable-compact-nav i{
    font-size:11px !important;
}

.timetable-compact-title{
    font-size:20px !important;
    line-height:1.2 !important;
}

.timetable-compact-subtitle{
    font-size:11px !important;
    line-height:1.3 !important;
}

.timetable-compact-section{
    font-size:13px !important;
}

.timetable-compact-card-title{
    font-size:13px !important;
}

</style>
</head>
<body>
<div class="box">
<h1>Edit Timetable Lesson</h1>

<p>
<strong>{{ lesson.subject.name }}</strong><br>
{{ lesson.class_group }}
</p>

<form method="post">
{% csrf_token %}

<label>Day</label>
<select name="day" required>
{% for day in days %}
<option value="{{ day.id }}" {% if day.id == lesson.day_id %}selected{% endif %}>
{{ day.name }}
</option>
{% endfor %}
</select>

<label>Period</label>
<select name="period" required>
{% for period in periods %}
<option value="{{ period.id }}" {% if period.id == lesson.period_id %}selected{% endif %}>
{{ period.name }} — {{ period.start_time|time:"H:i" }} - {{ period.end_time|time:"H:i" }}
</option>
{% endfor %}
</select>

<label>Teacher</label>
<select name="teacher">
<option value="">Not assigned</option>
{% for teacher in teachers %}
<option value="{{ teacher.id }}" {% if lesson.teacher_id == teacher.id %}selected{% endif %}>
{{ teacher.name }}
</option>
{% endfor %}
</select>

<label>Room</label>
<select name="room">
<option value="">Not assigned</option>
{% for room in rooms %}
<option value="{{ room.id }}" {% if lesson.room_id == room.id %}selected{% endif %}>
{{ room.name }}
</option>
{% endfor %}
</select>

<label>Notes</label>
<textarea name="notes" rows="4">{{ lesson.notes }}</textarea>

<button type="submit">Save Changes</button>
<a href="{% url 'timetable:workspace' %}">Cancel</a>

</form>
</div>
</body>
</html>
