<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f7fb; }
        .topbar { background:#0b2d6b; color:white; padding:18px 30px; }
    </style>
</head>
<body>

<div class="topbar">
    <h3 class="mb-0 fw-bold">{{ title }}</h3>
</div>

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between mb-4">
        <h2 class="fw-bold">{{ title }}</h2>
        <a href="{{ back }}" class="btn btn-outline-primary">Back</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            {% if items %}
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for item in items %}
                        <tr>
                            <td class="fw-semibold">{{ item }}</td>
                            <td>{{ item }}</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
                <div class="text-center py-5">
                    <h5>No records yet</h5>
                    <p class="text-muted">{{ empty }}</p>
                    <a href="/admin/timetable/" class="btn btn-primary">
                        Open Timetable Administration
                    </a>
                </div>
            {% endif %}

        </div>
    </div>

</div>
</body>
</html>
