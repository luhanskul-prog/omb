{% extends "base.html" %}

{% block content %}

<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h4>Student Admission Form</h4>
    </div>

    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">
                Save Student
            </button>

        </form>

    </div>
</div>

{% endblock %}
