{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                Edit Fee Structure
            </h2>
        </div>

        <a href="{% url 'fee_structure_settings' %}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Back
        </a>

    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Academic Year
                        </label>

                        <select name="academic_year"
                                class="form-select"
                                required>

                            {% for year in years %}

                                <option value="{{ year.id }}"
                                    {% if structure.academic_year_id == year.id %}
                                        selected
                                    {% endif %}>

                                    {{ year.year }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Term
                        </label>

                        <select name="term"
                                class="form-select"
                                required>

                            {% for term in terms %}

                                <option value="{{ term.id }}"
                                    {% if structure.term_id == term.id %}
                                        selected
                                    {% endif %}>

                                    {{ term.name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Class
                        </label>

                        <select name="class_name"
                                class="form-select"
                                required>

                            {% for class_name in classes %}

                                <option value="{{ class_name }}"
                                    {% if structure.class_name == class_name %}
                                        selected
                                    {% endif %}>

                                    {{ class_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Fee Item
                        </label>

                        <input type="text"
                               name="fee_item"
                               class="form-control"
                               value="{{ structure.fee_item }}"
                               required>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Amount
                        </label>

                        <input type="number"
                               name="amount"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="{{ structure.amount }}"
                               required>

                    </div>

                </div>

                <div class="mt-4">

                    <button class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>
                        Save Changes
                    </button>

                    <a href="{% url 'fee_structure_settings' %}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
