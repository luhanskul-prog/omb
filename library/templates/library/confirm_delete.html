{% extends "library/base.html" %}
{% load library_extras %}

{% block page_title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="form-card">

<h2>Confirm Action</h2>

<p>
Are you sure you want to delete:
<strong>{{ object }}</strong>?
</p>

<form method="post">

{% csrf_token %}

<div class="actions">

<button class="btn danger"
        type="submit">
Yes, Delete
</button>

<a class="btn secondary"
   href="{% url back_url %}">
Cancel
</a>

</div>

</form>

</div>

{% endblock %}
