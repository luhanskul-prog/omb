<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if attendance %}
            Edit Attendance
        {% else %}
            Record Attendance
        {% endif %}
        | Luhan School
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 22px 30px;
        }

        .header h1 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #64748b;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
            margin-bottom: 8px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .container {
                padding: 0 12px;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        Employee Attendance
    </h1>

    <p>
        Luhan School Management System
    </p>

</div>


<div class="container">


    <div class="card">

        <h2>

            {% if attendance %}
                Edit Attendance
            {% else %}
                Record Attendance
            {% endif %}

        </h2>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-grid">


                <div class="field full">

                    <label>
                        Employee *
                    </label>

                    <select
                        name="employee"
                        required
                    >

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                            <option
                                value="{{ employee.id }}"

                                {% if attendance and attendance.employee_id == employee.id %}
                                    selected

                                {% elif form_data.employee == employee.id|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >

                                {{ employee.full_name }}
                                —
                                {{ employee.employee_number }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="field">

                    <label>
                        Date *
                    </label>

                    <input
                        type="date"
                        name="date"
                        required

                        value="{% if attendance %}{{ attendance.date|date:'Y-m-d' }}{% elif form_data.date %}{{ form_data.date }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}"
                    >

                </div>


                <div class="field">

                    <label>
                        Status *
                    </label>

                    <select
                        name="status"
                        required
                    >

                        {% for value,label in status_choices %}

                            <option
                                value="{{ value }}"

                                {% if attendance and attendance.status == value %}
                                    selected

                                {% elif not attendance and form_data.status == value %}
                                    selected
                                {% elif not attendance and not form_data.status and value == "PRESENT" %}
                                    selected
                                {% endif %}
                            >

                                {{ label }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="field">

                    <label>
                        Check In
                    </label>

                    <input
                        type="time"
                        name="check_in"

                        value="{% if attendance and attendance.check_in %}{{ attendance.check_in|time:'H:i' }}{% elif form_data.check_in %}{{ form_data.check_in }}{% endif %}"
                    >

                </div>


                <div class="field">

                    <label>
                        Check Out
                    </label>

                    <input
                        type="time"
                        name="check_out"

                        value="{% if attendance and attendance.check_out %}{{ attendance.check_out|time:'H:i' }}{% elif form_data.check_out %}{{ form_data.check_out }}{% endif %}"
                    >

                </div>


                <div class="field full">

                    <label>
                        Remarks
                    </label>

                    <textarea
                        name="remarks"
                        placeholder="Enter any remarks..."
                    >{% if attendance %}{{ attendance.remarks|default:"" }}{% elif form_data.remarks %}{{ form_data.remarks }}{% endif %}</textarea>

                </div>


            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn"
                >

                    {% if attendance %}
                        Update Attendance
                    {% else %}
                        Save Attendance
                    {% endif %}

                </button>


                <a
                    href="{% url 'hr_payroll:attendance_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>


</div>


</body>

</html>
