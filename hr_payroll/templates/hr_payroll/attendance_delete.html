<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Attendance | Luhan School</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        h1 {
            color: #991b1b;
        }

        .info {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            color: white;
            background: #dc2626;
        }

        .cancel {
            background: #64748b;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <h1>
            Delete Attendance
        </h1>

        <p>
            Are you sure you want to delete this attendance record?
        </p>


        <div class="info">

            <strong>
                {{ attendance.employee.full_name }}
            </strong>

            <br>

            {{ attendance.date|date:"d M Y" }}

            <br>

            {{ attendance.get_status_display }}

        </div>


        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="btn"
            >
                Yes, Delete
            </button>

            <a
                href="{% url 'hr_payroll:attendance_list' %}"
                class="btn cancel"
            >
                Cancel
            </a>

        </form>

    </div>

</div>


</body>

</html>
