<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Staff Self-Service{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #0d6efd;
            color: white;
            padding: 16px 24px;
        }

        .page-wrap {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .table th {
            background: #f1f5f9;
            white-space: nowrap;
        }

        .stat-card {
            padding: 20px;
            height: 100%;
        }

        .stat-label {
            color: #64748b;
            font-size: 13px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: 700;
        }

        .back-link {
            text-decoration: none;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="topbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div>
            <div class="fw-bold">
                Staff Self-Service Portal
            </div>
            <small>
                {{ employee.full_name }}
            </small>
        </div>

        <a
            href="{% url 'accounts:staff_dashboard' %}"
            class="btn btn-light btn-sm"
        >
            <i class="bi bi-grid me-1"></i>
            Dashboard
        </a>
    </div>
</div>

<div class="page-wrap">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
